spring.application.name=api-gateway

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# expose prometheus endpoint
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# --- Circuit Breaker (Resilience4j) ---
#
# One default config that applies to every per-upstream circuit breaker.
# Each upstream instance gets its own CB named by its URL, so a single
# dead backend doesn't affect the others in the pool.
#
# CLOSED  ? normal, requests flow through
# OPEN    ? upstream is failing, requests fail fast without hitting the backend
# HALF_OPEN ? after waitDurationInOpenState, lets a few requests through to probe
#             if the upstream has recovered

# Sliding window: last 10 calls are evaluated
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10

# Open the circuit when 50% of the last 10 calls fail
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50

# Wait 30s in OPEN before probing with HALF_OPEN
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s

# Allow 3 test calls in HALF_OPEN to decide if backend recovered
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

# Minimum 5 calls before failure rate is even calculated
# (avoids opening on first request)
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5

# Expose CB metrics to Prometheus
resilience4j.circuitbreaker.configs.default.register-health-indicator=true