services:
  redis:
    image: redis:latest
    container_name: gateway-redis
    ports:
      - "6379:6379"
    networks:
      - gateway-network

  gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - spring.data.redis.host=redis
      - spring.data.redis.port=6379
    depends_on:
      - redis
    networks:
      - gateway-network
    healthcheck:
      # Alpine's BusyBox wget uses -q and -O- (no --spider), this works on temurin alpine
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 50s

  k6:
    image: grafana/k6:latest
    container_name: k6-runner
    networks:
      - gateway-network
    volumes:
      - ./k6:/scripts
    depends_on:
      gateway:
        condition: service_healthy
    command: run /scripts/load-test.js

networks:
  gateway-network:
    driver: bridge